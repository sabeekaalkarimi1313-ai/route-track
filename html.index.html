<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a33">
  <meta name="description" content="Route Lab — record a GPS route and measure distance, time and speed.">
  <title>Route Lab</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --ink:#0f2a33; --muted:#5d727b; --line:#d5dfe3; --paper:#ffffff;
      --teal:#0b7285; --route:#e4572e; --ok:#2b8a3e; --warn:#b4540a;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#dfe7ea; -webkit-tap-highlight-color:transparent; }
    #map { position:fixed; inset:0; }

    .panel {
      position:fixed; z-index:1000; left:10px; right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom, 0px));
      max-width:520px; margin:0 auto; padding:14px 14px 12px;
      background:var(--paper); border-radius:18px; box-shadow:0 10px 36px rgba(15,42,51,.28);
    }
    .distance { display:flex; align-items:baseline; gap:6px; }
    .distance .value { font-size:46px; font-weight:800; letter-spacing:-1px; line-height:1; font-variant-numeric:tabular-nums; }
    .distance .unit { font-size:18px; font-weight:600; color:var(--muted); }
    .state { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#9aa9b0; }
    .dot.rec { background:var(--route); animation:pulse 1.4s ease-in-out infinite; }
    .dot.paused { background:var(--warn); }
    @keyframes pulse { 50% { opacity:.35; } }
    @media (prefers-reduced-motion:reduce) { .dot.rec { animation:none; } }

    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .stat .v { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
    .stat .l { font-size:11px; color:var(--muted); margin-top:1px; }

    .msg { min-height:16px; font-size:12px; color:var(--muted); margin:-2px 0 10px; }
    .msg.err { color:#c92a2a; }

    .row { display:flex; gap:8px; }
    button {
      font:inherit; font-weight:700; font-size:15px; border:0; border-radius:12px; padding:13px 10px;
      cursor:pointer; background:#e9eff1; color:var(--ink); flex:1; min-height:48px;
    }
    button:focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
    button:disabled { opacity:.45; cursor:default; }
    button.primary { background:var(--teal); color:#fff; flex:2; }
    button.stop { background:var(--route); color:#fff; }
    .row.secondary { margin-top:8px; }
    .row.secondary button { font-size:13px; font-weight:600; min-height:40px; padding:9px 6px; background:transparent; border:1px solid var(--line); }

    .leaflet-control-attribution { font-size:10px; }
    .leaflet-top { top:env(safe-area-inset-top, 0px); }
  </style>
</head>
<body>
  <div id="map" aria-label="Route map"></div>

  <section class="panel" aria-label="Route controls">
    <div class="distance">
      <span class="value" id="distance">0.00</span><span class="unit" id="distUnit">km</span>
      <span class="state"><span class="dot" id="dot"></span><span id="stateText">Ready</span></span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="time">00:00</div><div class="l">Time</div></div>
      <div class="stat"><div class="v" id="speed">0.0</div><div class="l" id="speedLabel">Speed km/h</div></div>
      <div class="stat"><div class="v" id="avg">0.0</div><div class="l" id="avgLabel">Avg km/h</div></div>
      <div class="stat"><div class="v" id="acc">–</div><div class="l">Accuracy</div></div>
    </div>

    <div class="msg" id="msg" role="status"></div>

    <div class="row">
      <button class="primary" id="startBtn">Start route</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button class="stop" id="stopBtn" disabled>Stop</button>
    </div>
    <div class="row secondary">
      <button id="centerBtn">Center</button>
      <button id="unitBtn">Units: km</button>
      <button id="gpxBtn" disabled>Save GPX</button>
      <button id="clearBtn" disabled>Clear</button>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
