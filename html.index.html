<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Route Lab — live GPS location and accuracy on an OpenStreetMap map.">
  <title>Route Lab</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: dark; --bg:#101820; --panel:rgba(16,24,32,.94); --text:#f5f7fa; --muted:#aab6c2; --accent:#63e6be; --danger:#ff7b7b; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    #map { position:fixed; inset:0; background:#dce5e8; }
    .topbar { position:fixed; z-index:1000; top:env(safe-area-inset-top, 0px); left:0; right:0; padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; pointer-events:none; background:linear-gradient(to bottom,rgba(16,24,32,.88),rgba(16,24,32,0)); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:.2px; text-shadow:0 1px 8px #0008; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:var(--accent); color:#0c2a24; font-size:19px; box-shadow:0 4px 18px #0003; }
    .tagline { color:#e1e8ed; font-size:12px; margin:3px 0 0 44px; text-shadow:0 1px 6px #0009; }
    .panel { position:fixed; z-index:1000; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); max-width:560px; margin:0 auto; padding:16px; border:1px solid #ffffff20; border-radius:22px; background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 12px 40px #0004; }
    .status-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .status { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
    .dot { width:9px; height:9px; border-radius:50%; background:#8794a0; flex:none; }
    .dot.live { background:var(--accent); box-shadow:0 0 0 4px #63e6be20; }
    .accuracy-pill { font-size:12px; color:#c9d5dc; border:1px solid #ffffff22; border-radius:999px; padding:5px 9px; white-space:nowrap; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .metric { padding:11px 12px; background:#ffffff09; border:1px solid #ffffff0c; border-radius:14px; min-width:0; }
    .metric-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.8px; margin-bottom:5px; }
    .metric-value { font-size:clamp(17px,4.5vw,22px); font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.5px; overflow-wrap:anywhere; }
    .metric-value small { font-size:12px; color:var(--muted); font-weight:500; letter-spacing:0; }
    .actions { display:flex; gap:10px; }
    button { min-height:48px; border:0; border-radius:14px; padding:0 16px; font:700 15px system-ui,sans-serif; cursor:pointer; touch-action:manipulation; }
    button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    #startBtn { flex:1; color:#08281f; background:var(--accent); }
    #startBtn:disabled { opacity:.65; cursor:wait; }
    #centerBtn { color:var(--text); background:#ffffff12; border:1px solid #ffffff20; }
    .message { font-size:12px; line-height:1.45; color:var(--muted); margin:11px 2px 0; min-height:17px; }
    .message.error { color:var(--danger); }
    .leaflet-control-attribution { font-size:10px !important; }
    .leaflet-control-zoom { margin-top:95px !important; }
    .location-dot { width:18px; height:18px; border-radius:50%; background:#168cff; border:3px solid white; box-shadow:0 0 0 7px #168cff33,0 2px 8px #0005; }
    .accuracy-circle { stroke:#168cff; stroke-width:1.5; fill:#168cff; fill-opacity:.12; }
    @media (min-width:700px) { .panel { left:24px; right:auto; bottom:24px; width:420px; } .topbar { padding-left:24px; } }
    @media (max-height:620px) { .panel { padding:12px; } .metrics { margin-bottom:10px; gap:8px; } .metric { padding:8px 10px; } .message { margin-top:7px; } button { min-height:43px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing your GPS location"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⌖</span><span>Route Lab</span></div>
    <div class="tagline">Live GPS · OpenStreetMap</div>
  </header>

  <section class="panel" aria-label="GPS controls and coordinates">
    <div class="status-row">
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">GPS is off</span></div>
      <div id="accuracyPill" class="accuracy-pill">Accuracy —</div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Latitude</div><div id="lat" class="metric-value">—</div></div>
      <div class="metric"><div class="metric-label">Longitude</div><div id="lon" class="metric-value">—</div></div>
      <div class="metric"><div class="metric-label">GPS accuracy</div><div id="accuracy" class="metric-value">— <small>metres</small></div></div>
      <div class="metric"><div class="metric-label">Last update</div><div id="updated" class="metric-value">—</div></div>
    </div>
    <div class="actions">
      <button id="startBtn" type="button">Start GPS</button>
      <button id="centerBtn" type="button" aria-label="Center map on my location">◎ Center</button>
    </div>
    <p id="message" class="message" role="status" aria-live="polite">Tap Start GPS and allow location access when your browser asks.</p>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const map = L.map('map', { zoomControl: false }).setView([23.7, 120.9], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }).addTo(map);
      L.control.zoom({ position: 'topright' }).addTo(map);

      let watchId = null;
      let marker = null;
      let accuracyCircle = null;
      let latestPosition = null;
      let firstFix = true;

      const startBtn = $('startBtn');
      const statusText = $('statusText');
      const statusDot = $('statusDot');
      const message = $('message');

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle('error', isError);
      }
      function formatCoord(value) { return Number(value).toFixed(6); }
      function stopWatching() {
        if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        startBtn.textContent = 'Start GPS';
        startBtn.disabled = false;
        statusText.textContent = 'GPS is off';
        statusDot.classList.remove('live');
      }
      function onPosition(position) {
        latestPosition = position;
        const { latitude, longitude, accuracy } = position.coords;
        $('lat').textContent = formatCoord(latitude);
        $('lon').textContent = formatCoord(longitude);
        $('accuracy').innerHTML = `${Math.round(accuracy)} <small>metres</small>`;
        $('accuracyPill').textContent = `±${Math.round(accuracy)} m`;
        $('updated').textContent = new Date(position.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        const point = [latitude, longitude];

        if (!marker) {
          marker = L.marker(point, {
            icon: L.divIcon({ className: '', html: '<div class="location-dot"></div>', iconSize: [18,18], iconAnchor: [9,9] }),
            title: 'Your current location'
          }).addTo(map);
          marker.bindPopup('You are here');
        } else {
          marker.setLatLng(point);
        }
        if (!accuracyCircle) {
          accuracyCircle = L.circle(point, { radius: accuracy, className: 'accuracy-circle' }).addTo(map);
        } else {
          accuracyCircle.setLatLng(point);
          accuracyCircle.setRadius(accuracy);
        }
        if (firstFix) {
          map.setView(point, Math.max(map.getZoom(), 16), { animate: true });
          firstFix = false;
          setMessage('Location found. Route Lab is following your live GPS position.');
        } else {
          setMessage('Live GPS is active. Move around to see your position update.');
        }
        statusText.textContent = 'Following live GPS';
        statusDot.classList.add('live');
        startBtn.textContent = 'Stop GPS';
        startBtn.disabled = false;
      }
      function onError(error) {
        let explanation = 'Could not get your location.';
        if (error.code === 1) explanation = 'Location permission was denied. Allow location access in your browser settings, then try again.';
        else if (error.code === 2) explanation = 'Your location is unavailable. Check that device location services are on and try outdoors.';
        else if (error.code === 3) explanation = 'GPS took too long to respond. Try again in an area with a clearer view of the sky.';
        stopWatching();
        setMessage(explanation, true);
      }
      function startWatching() {
        if (!('geolocation' in navigator)) {
          setMessage('This browser does not support GPS location. Please use a recent Safari or Chrome browser.', true);
          return;
        }
        if (!window.isSecureContext) {
          setMessage('GPS requires a secure connection. Open this app through GitHub Pages (HTTPS), not an ordinary HTTP page.', true);
          return;
        }
        firstFix = true;
        startBtn.disabled = true;
        startBtn.textContent = 'Starting…';
        statusText.textContent = 'Requesting location…';
        setMessage('Waiting for GPS. Please allow location access and keep this page open.');
        watchId = navigator.geolocation.watchPosition(onPosition, onError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 20000
        });
      }
      startBtn.addEventListener('click', () => {
        if (watchId !== null) {
          stopWatching();
          setMessage('GPS tracking stopped.');
        } else {
          startWatching();
        }
      });
      $('centerBtn').addEventListener('click', () => {
        if (latestPosition) {
          map.setView([latestPosition.coords.latitude, latestPosition.coords.longitude], Math.max(map.getZoom(), 16), { animate: true });
          if (marker) marker.openPopup();
        } else {
          setMessage('Start GPS first to center the map on your current location.');
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && watchId !== null) map.invalidateSize();
      });
      window.addEventListener('resize', () => map.invalidateSize());
    })();
  </script>
</body>
</html>
